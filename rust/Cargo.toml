[workspace]
resolver = "2"
members = ["crates/hph-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alloy = {version = "1", features = ["full"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
anyhow = "1"
tokio = {version = "1", features = ["full"]}
